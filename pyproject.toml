[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superscope"
version = "0.1.0"
description = "Enhanced OSINT username scanner with cross-platform correlation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "SuperScope Contributors"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Information Technology",
    "Topic :: Security :: Reconnaissance",
    "Operating System :: OS Independent",
]

dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40.0"]
openai = ["openai>=1.0.0"]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
all = [
    "superscope[playwright]",
    "superscope[openai]",
    "superscope[web]",
]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
superscope = "superscope.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["superscope*"]
